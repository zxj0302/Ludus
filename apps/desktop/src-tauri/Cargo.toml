[package]
name = "ludus-desktop"
version = "0.1.1"
description = "Ludus desktop shell"
authors = ["Ludus"]
edition = "2021"

[lib]
name = "ludus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
