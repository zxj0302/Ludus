name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build web (SPA)
        run: pnpm --filter ludus-web build

      - name: Build shell (Tauri / Capacitor)
        run: pnpm build:shell

      - name: Verify shell relative asset paths
        run: grep -q 'src="./assets/' apps/web/dist/index.html

      - name: Build pages (GitHub Pages)
        run: pnpm build:pages

      - name: Verify pages base path
        run: grep -q 'src="/Ludus/assets/' apps/web/dist/index.html

  # Pages deploy disabled: personal accounts cannot set private visibility.
  # Use pnpm dev / pnpm dev:desktop for local-only access.
